<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <!-- Google Analytics 4 (GA4) ------------------------------------------
       1. Go to https://analytics.google.com → Admin → Create Property
          (pick "Web" as the platform) and copy your Measurement ID,
          which looks like  G-XXXXXXXXXX.
       2. Replace the G-XXXXXXXXXX below with your real ID, then rebuild.
       GA4 automatically reports visitor counts, country/city, referral
       source (where they came from), device & browser, and real-time
       users — no extra code needed for those.
       The guard below skips loading while the placeholder is in place,
       so local/dev builds send no data until you set a real ID. -->
  <script>
    (function () {
      var GA_ID = "G-NFE235P6CJ";
      if (GA_ID.indexOf("XXXX") !== -1) return; // placeholder — not configured yet
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag("js", new Date());
      gtag("config", GA_ID);
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
  <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a09" />
  <meta name="description"
    content="Darshan Parmar — Full-Stack Developer based in Mumbai, India. Crafting clean, scalable web applications with React, Laravel & PHP." />

  <!-- PWA / installable app -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- Translucent status bar so content runs edge-to-edge; safe-area insets in
       CSS keep the nav/hero clear of it (see --safe-top). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Darshan" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Darshan Parmar — Full-Stack Developer" />
  <meta property="og:description"
    content="Crafting clean, scalable digital experiences with React, Laravel & PHP." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

</head>
